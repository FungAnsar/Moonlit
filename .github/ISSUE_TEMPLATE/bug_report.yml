name: Bug report
description: Report a reproducible problem with Moonlit on the web, iPhone, or iPad.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Moonlit. Please do not include passwords, tokens, private account information, private URLs, or other sensitive information in this public report.
  - type: input
    id: moonlit-version
    attributes:
      label: Moonlit version
      description: Enter the app version, or the website version or date if reporting a web issue.
      placeholder: "For example: 1.5"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web
        - iPhone
        - iPad
    validations:
      required: true
  - type: input
    id: os-browser
    attributes:
      label: OS / browser
      placeholder: "For example: iOS 18.6, iPadOS 18.6, or Safari 18 on macOS"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem. Remove or redact any private information.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots or useful context. Do not include passwords, tokens, private account details, or private URLs.
