name: Feature request
description: Suggest an improvement to Moonlit.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please do not include passwords, tokens, private account information, private URLs, or other sensitive information.
  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: What would you like Moonlit to do?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the reading, discovery, or learning situation this would help with.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Why this would improve Moonlit
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include any mockups, examples, or context that could help explain the request.
